# Mega Man Battle Network 1 (USA) — save layout
#
# Every offset below is a byte offset into the save file (= SRAM on the cart).
# BN1 saves by copying EWRAM 0x02000000..0x02002307 straight to SRAM, so a save
# offset is the same as (EWRAM address - 0x02000000).
#
# Source of truth: Silenthal/bn1 disassembly
#   source/save.S      — save length 0x2308, checksum algorithm, build ID
#   ld_script.ld       — gFlagBase=0x000, gWorld=0x210, gKeyItemInventory=0x2D0, gGameStats=0x3D0
#   include/mmbn.h     — struct World / struct GameStats field order
#   source/flag.S      — flag bit order (MSB first), library flags = 0x100 + chip id
#   source/main_menu.S + credits.S — title-screen star = base flag 0x05, set after the credits
#   source/key_item.S  — HP = 100 + 20 * HPMemory count
# Verified against playground/save files/m1.sav and mmbn1.2104.sav (checksums match).

[game]
id = "bn1"
name = "Mega Man Battle Network"
region = "USA"
save_length = 0x2308
signature = { offset = 0x3FC, ascii = "ROCKMAN EXE 20010727" }   # GameStats.buildId
rom_game_codes = ["AREE"]   # ROM header 0xAC (for cart identification); unverified on real cart

[checksum]
kind = "byte_sum"     # sum of every byte in [start, end) with the checksum field zeroed, plus `add`
offset = 0x3F0        # GameStats.checksum (u32)
start = 0x0
end = 0x2308
add = 0x16

[flags]
base = 0x000
bit_order = "msb"     # flag n -> byte base + n//8, mask 0x80 >> (n % 8)

[flags.named]
star_game_cleared = 0x005   # title-screen star; set when you save after the credits

[fields.story_flag]
offset = 0x216        # World.storyFlag
type = "u8"

[fields.zenny]
offset = 0x284        # World.zenny
type = "u32"
max = 999999          # cap applied by the game when awarding zenny

[fields.hp_max]
offset = 0x22E        # World.hpMax (0x22C is hpCurrent)
type = "u16"
max = 1000

[fields.play_time_frames]
offset = 0x3E8        # GameStats.gameTimer, 60 frames per second, capped at 99:59
type = "u32"

[fields.buster_attack]
offset = 0x224        # World.statAttack (0 = level 1)
type = "u8"
max = 4

[fields.buster_speed]
offset = 0x225
type = "u8"
max = 4

[fields.buster_charge]
offset = 0x226
type = "u8"
max = 4

[fields.hp_memories]
offset = 0x310        # gKeyItemInventory[Item_HpMemory=64]
type = "u8"
max = 45              # 100 + 45 * 20 = 1000 HP

[fields.heat_armor]
offset = 0x314        # gKeyItemInventory[Item_HeatArmr=68]
type = "bool"

[fields.aqua_armor]
offset = 0x315        # gKeyItemInventory[Item_AquaArmr=69]
type = "bool"

[fields.wood_armor]
offset = 0x316        # gKeyItemInventory[Item_WoodArmr=70]
type = "bool"

[fields.battles_total]
offset = 0x3E2        # GameStats.totalBattles16
type = "u16"

[story]
field = "story_flag"
chapter_shift = 4     # high nibble = scenario index (0-5)
chapters = 6
final = 84

[library]
flag_offset = 0x100   # library flag = 0x100 + chip id
secret = [199]        # Bass: not counted toward the 175 standard chips

[library.groups]
navi = { first = 148, last = 198 }   # PharoMan .. ElecMan3

